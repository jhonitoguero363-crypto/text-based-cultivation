name: Build and push Docker image

on:
  push:
    branches:
      - main
      - ai
  workflow_dispatch:

env:
  IMAGE_NAME: text-based-cultivation

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: image
        env:
          TCR_REGISTRY: ${{ secrets.TCR_REGISTRY }}
          TCR_NAMESPACE: ${{ secrets.TCR_NAMESPACE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          trim() { printf '%s' "$1" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          registry="$(trim "$TCR_REGISTRY")"
          namespace="$(trim "$TCR_NAMESPACE")"
          if [ -z "$registry" ] || [ -z "$namespace" ]; then
            echo "::error::TCR_REGISTRY or TCR_NAMESPACE is empty. Add both in Settings → Secrets and variables → Actions (no trailing newline)."
            exit 1
          fi
          if [ -z "$(trim "$LLM_API_KEY")" ] || [ -z "$(trim "$LLM_BASE_URL")" ] || [ -z "$(trim "$LLM_MODEL")" ]; then
            echo "::error::LLM_API_KEY / LLM_BASE_URL / LLM_MODEL must all be set in Actions secrets (same place as TCR_*)."
            exit 1
          fi
          echo "registry=${registry}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${registry}/${namespace}/${IMAGE_NAME}:latest"
            echo "${registry}/${namespace}/${IMAGE_NAME}:${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Tencent Cloud TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            LLM_API_KEY=${{ secrets.LLM_API_KEY }}
            LLM_BASE_URL=${{ secrets.LLM_BASE_URL }}
            LLM_MODEL=${{ secrets.LLM_MODEL }}
            GATEWAY_TOKEN=${{ secrets.GATEWAY_TOKEN }}
